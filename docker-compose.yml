# ══════════════════════════════════════════════
#  ATe — Docker Compose
#  MongoDB + Redis(broker) + Backend + Worker + Frontend
# ══════════════════════════════════════════════

services:
  # ━━━━━━━━━━ Data Tier ━━━━━━━━━━
  database:
    image: mongo:6.0
    restart: always
    networks:
      - backend_net
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PASSWORD}
      - MONGO_INITDB_DATABASE=${DB_NAME}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  broker:
    image: redis:7-alpine
    restart: always
    networks:
      - backend_net
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ━━━━━━━━━━ Application Tier ━━━━━━━━━━
  backend:
    depends_on:
      database:
        condition: service_healthy
      broker:
        condition: service_healthy
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    networks:
      - backend_net
      - frontend_net
    environment:
      - MONGO_URL=mongodb://${DB_USER}:${DB_PASSWORD}@database:27017/${DB_NAME}?authSource=admin
      - DB_NAME=${DB_NAME}
      - REDIS_URL=redis://broker:6379/0
      - CELERY_BROKER_URL=redis://broker:6379/1
      - CELERY_RESULT_BACKEND=redis://broker:6379/2
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEBUG=True
    volumes:
      - ./backend:/app/backend
      - ./common:/app/common
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    depends_on:
      database:
        condition: service_healthy
      broker:
        condition: service_healthy
    build:
      context: .
      dockerfile: worker/Dockerfile
    user: root
    restart: unless-stopped
    networks:
      - backend_net
    environment:
      - MONGO_URL=mongodb://${DB_USER}:${DB_PASSWORD}@database:27017/${DB_NAME}?authSource=admin
      - DB_NAME=${DB_NAME}
      - REDIS_URL=redis://broker:6379/0
      - CELERY_BROKER_URL=redis://broker:6379/1
      - CELERY_RESULT_BACKEND=redis://broker:6379/2
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ./backend:/app/backend
      - ./worker:/app/worker
      - ./common:/app/common
      - /var/run/docker.sock:/var/run/docker.sock
    command: celery -A main.celery_app worker --loglevel=info --queues=test_execution,ci_cd,default --concurrency=4

  # ━━━━━━━━━━ Presentation Tier ━━━━━━━━━━
  frontend:
    depends_on:
      - backend
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - frontend_net
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  redis_data:
  mongo_data:

networks:
  frontend_net:
  backend_net:
